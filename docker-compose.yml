services:
  subtunnel-postgres:
    image: postgres:16-alpine
    container_name: subtunnel-postgres
    environment:
      POSTGRES_DB: subtunnel
      POSTGRES_USER: subtunnel
      POSTGRES_PASSWORD: subtunnel
    ports:
      - "5433:5432"
    volumes:
      - subtunnel_pgdata:/var/lib/postgresql/data

volumes:
  subtunnel_pgdata:
