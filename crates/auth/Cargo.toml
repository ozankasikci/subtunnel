[package]
name = "subtunnel-auth"
version = "0.1.0"
edition = "2021"

[dependencies]
jsonwebtoken = "9"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
subtunnel-shared = { path = "../shared" }
