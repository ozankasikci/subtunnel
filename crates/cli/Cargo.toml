[package]
name = "subtunnel"
version = "0.1.0"
edition = "2021"
description = "A self-hosted ngrok alternative written in Rust"
license = "MIT"
repository = "https://github.com/winterwindgames/subtunnel"
homepage = "https://subtunnel.dev"
readme = "../../README.md"
keywords = ["tunnel", "ngrok", "reverse-proxy", "networking"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "subtunnel"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
yamux = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = "0.13"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
tokio-util = { version = "0.7", features = ["codec", "compat"] }
futures = "0.3"
rand = "0.8"
rustls-pki-types = "1"
webpki-roots = "0.26"
rustls-pemfile = "2"
socket2 = "0.6"

[dev-dependencies]
tokio-test = "0.4"
